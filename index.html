<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>32-bit Register Editor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #09090f;
    --bg-row: #0d0f17;
    --text-primary: #c0cce0;
    --text-secondary: #4a5a82;
    --text-tertiary: #56678f;
    --border-main: #161e30;
    --border-sec: #1a2030;
    --bit-off-bg: #11151f;
    --bit-off-border: #242d44;
    --bit-off-text: #4e5e84;
    --hex-color: #00b894;
    --hex-light: #0d2820;
    --dec-color: #6a8fe8;
    --dec-light: #121836;
    --modal-bg: #0f1220;
    --modal-border: #1a2438;
    --modal-display-bg: #09090f;
    --modal-del-bg: #180f10;
    --modal-del-border: #2a1218;
    --legend-color: #5e6e90;
    --legend-hint: #455472;
    --hex-pre: #2f5a4c;
  }

  body.light-mode {
    --bg-main: #f5f5f8;
    --bg-row: #ebebf0;
    --text-primary: #1a1a2e;
    --text-secondary: #4a5a7a;
    --text-tertiary: #6a7a9a;
    --border-main: #d0d5e0;
    --border-sec: #c5cad8;
    --bit-off-bg: #e8ecf5;
    --bit-off-border: #d0d8e8;
    --bit-off-text: #a0b0c8;
    --hex-color: #1a8a60;
    --hex-light: #d0e8e0;
    --dec-color: #3a5ab8;
    --dec-light: #e0e8f8;
    --modal-bg: #f0f2f8;
    --modal-border: #d8dce8;
    --modal-display-bg: #f5f5f8;
    --modal-del-bg: #f0e8e8;
    --modal-del-border: #e8d0d0;
    --legend-color: #707090;
    --legend-hint: #9a9aaa;
    --hex-pre: #8a9ab8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    padding: 24px 12px;
    gap: 0;
    color: var(--text-primary);
    transition: background 0.3s, color 0.3s;
  }

  .top-bar {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .theme-toggle {
    background: var(--border-main);
    border: 1px solid var(--border-sec);
    border-radius: 8px;
    padding: 6px 12px;
    color: var(--text-primary);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    user-select: none;
  }
  .theme-toggle:hover {
    border-color: var(--text-secondary);
  }

  .title {
    color: var(--text-secondary);
    font-size: 9px;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .col-headers {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .bit-num {
    width: 18px;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 7px;
  }

  .nibble-group {
    display: flex;
    gap: 2px;
  }

  .col-spacer { width: 22px; }
  .col-eq { width: 18px; }
  .col-hex-lbl { color: var(--text-tertiary); font-size: 9px; min-width: 100px; text-align: center; }
  .col-dec-lbl { color: var(--text-tertiary); font-size: 9px; min-width: 110px; text-align: right; }

  .row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    flex-wrap: wrap;
    justify-content: center;
    padding: 10px 12px;
    background: var(--bg-row);
    border-radius: 8px;
    transition: background 0.3s;
  }

  .row-label {
    color: var(--text-secondary);
    font-size: 9px;
    width: 22px;
    text-align: right;
    letter-spacing: 1px;
  }

  .bit {
    width: 18px;
    height: 26px;
    background: var(--bit-off-bg);
    border: 1px solid var(--bit-off-border);
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--bit-off-text);
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    transition: all 0.08s ease;
    font-family: 'JetBrains Mono', monospace;
  }
  .bit:hover { filter: brightness(1.4); transform: scale(1.08); }
  .bit.on {
    background: #d45f2a;
    border-color: #d45f2a;
    color: #ffe8d8;
    box-shadow: 0 0 7px #d45f2a55;
  }
  body.light-mode .bit.on {
    background: #e8561e;
    border-color: #e8561e;
    color: #fff5f0;
    box-shadow: 0 0 10px #e8561e44;
  }

  .eq-sign {
    color: var(--text-tertiary);
    font-size: 13px;
    padding: 0 2px;
  }

  .val-btn {
    background: var(--modal-display-bg);
    border: 1px solid var(--border-main);
    border-radius: 5px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: all 0.12s;
    font-family: 'JetBrains Mono', monospace;
  }
  .val-btn:hover { border-color: var(--text-secondary); }

  .hex-val {
    color: var(--hex-color);
    min-width: 100px;
    text-align: center;
    letter-spacing: 1px;
  }
  .hex-prefix { color: var(--hex-pre); font-size: 10px; }

  .dec-val {
    color: var(--dec-color);
    min-width: 110px;
    text-align: right;
  }

  .legend {
    margin-top: 16px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 2px;
  }
  .legend-dot.on { background: #d45f2a; box-shadow: 0 0 6px #d45f2a55; }
  body.light-mode .legend-dot.on { background: #e8561e; box-shadow: 0 0 6px #e8561e55; }
  .legend-dot.off { background: var(--bit-off-bg); border: 1px solid var(--bit-off-border); }
  .legend-text { color: var(--legend-color); font-size: 9px; letter-spacing: 2px; }
  .legend-hint { color: var(--legend-hint); font-size: 9px; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.82);
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  body.light-mode .modal-overlay {
    background: rgba(40, 52, 84, 0.22);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--modal-bg);
    border: 1px solid var(--modal-border);
    border-bottom: none;
    border-radius: 18px 18px 0 0;
    padding: 20px 16px 28px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 -12px 48px rgba(0,0,0,0.6);
    transition: background 0.3s, border-color 0.3s;
  }
  body.light-mode .modal {
    box-shadow: 0 -12px 48px rgba(60, 82, 140, 0.18);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .modal-title-wrap { display: flex; align-items: center; gap: 8px; }
  .modal-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .modal-dot.hex { background: #00b894; box-shadow: 0 0 8px #00b89488; }
  body.light-mode .modal-dot.hex { background: #1a8a60; box-shadow: 0 0 8px #1a8a6088; }
  .modal-dot.dec { background: #6a8fe8; box-shadow: 0 0 8px #6a8fe888; }
  body.light-mode .modal-dot.dec { background: #3a5ab8; box-shadow: 0 0 8px #3a5ab888; }
  .modal-label {
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .modal-label.hex { color: #00b894; }
  body.light-mode .modal-label.hex { color: #1a8a60; }
  .modal-label.dec { color: #6a8fe8; }
  body.light-mode .modal-label.dec { color: #3a5ab8; }

  .modal-close {
    background: var(--border-main);
    border: 1px solid var(--border-sec);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 12px;
    font-family: monospace;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  .modal-close:hover { border-color: var(--text-primary); }

  .modal-display {
    background: var(--modal-display-bg);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    min-height: 58px;
    transition: background 0.3s, border-color 0.3s;
  }
  .modal-display.hex { border: 1px solid var(--hex-light); }
  .modal-display.dec { border: 1px solid var(--dec-light); }

  .hex-pre-small { color: var(--hex-pre); font-size: 14px; font-weight: 600; }

  .display-value {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    font-family: 'JetBrains Mono', monospace;
  }
  .display-value.hex { color: var(--hex-color); }
  .display-value.dec { color: var(--dec-color); }

  .cursor {
    font-size: 18px;
    animation: blink 1s step-end infinite;
  }
  .cursor.hex { color: var(--hex-color); opacity: 0.5; }
  .cursor.dec { color: var(--dec-color); opacity: 0.5; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  .kb-grid { display: flex; flex-direction: column; gap: 6px; }
  .kb-row { display: flex; gap: 6px; }

  .kb-key {
    flex: 1;
    height: 46px;
    background: var(--border-main);
    border: 1px solid var(--border-sec);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.08s;
    user-select: none;
  }
  .kb-key:hover { filter: brightness(1.3); }
  .kb-key:active { transform: scale(0.94); }
  .kb-key.hex-letter { color: var(--hex-color); }
  .kb-key.enter { background: var(--dec-light); border-color: var(--dec-color); color: var(--dec-color); }
  body.light-mode .kb-key.enter { background: #e0e8f8; border-color: #3a5ab8; }
  .kb-key.del { background: var(--modal-del-bg); border-color: var(--modal-del-border); color: #c04040; }
  .kb-key.clr { background: var(--modal-del-bg); border-color: var(--modal-del-border); color: #c04040; }
  .kb-key.wide { height: 42px; }
</style>
</head>
<body>

<div class="top-bar">
  <button class="theme-toggle" id="theme-toggle">🌙 Dark</button>
</div>

<div class="title">32-bit Register Editor</div>

<!-- Column headers -->
<div class="col-headers" id="col-headers"></div>

<!-- Register rows -->
<div id="rows-container"></div>

<!-- Legend -->
<div class="legend">
  <div class="legend-item">
    <div class="legend-dot on"></div>
    <span class="legend-text">BIT ON</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot off"></div>
    <span class="legend-text">BIT OFF</span>
  </div>
  <span class="legend-hint">• klikni hex/dec pre zadanie čísla</span>
</div>

<!-- Keyboard modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <div class="modal-dot" id="modal-dot"></div>
        <span class="modal-label" id="modal-label"></span>
      </div>
      <button class="modal-close" onclick="closeKb()">✕</button>
    </div>
    <div class="modal-display" id="modal-display">
      <span class="hex-pre-small" id="modal-prefix"></span>
      <span class="display-value" id="display-value">0</span>
      <span class="cursor" id="modal-cursor">▌</span>
    </div>
    <div class="kb-grid" id="kb-grid"></div>
  </div>
</div>

<script>
  // ── Theme toggle ──────────────────────────────────────────
  const themeToggle = document.getElementById('theme-toggle');
  
  function applyTheme(mode) {
    if (mode === 'light') {
      document.body.classList.add('light-mode');
      themeToggle.textContent = '☀️ Light';
      localStorage.setItem('theme', 'light');
    } else {
      document.body.classList.remove('light-mode');
      themeToggle.textContent = '🌙 Dark';
      localStorage.setItem('theme', 'dark');
    }
  }

  // Load saved theme
  const savedTheme = localStorage.getItem('theme') || 'dark';
  applyTheme(savedTheme);

  themeToggle.addEventListener('click', () => {
    const current = document.body.classList.contains('light-mode') ? 'light' : 'dark';
    const newTheme = current === 'light' ? 'dark' : 'light';
    applyTheme(newTheme);
  });

  const NUM_ROWS = 4;
  const MAX_U32 = 0xFFFFFFFF;

  // State
  const values = new Uint32Array(4); // all 0

  // Active keyboard state
  let kbRow = -1;
  let kbMode = '';  // 'hex' | 'dec'
  let kbInput = '';

  const HEX_LAYOUT = [
    ['7','8','9','A'],
    ['4','5','6','B'],
    ['1','2','3','C'],
    ['0','D','E','F'],
    ['⌫','CLR','↵'],
  ];

  const DEC_LAYOUT = [
    ['7','8','9'],
    ['4','5','6'],
    ['1','2','3'],
    ['⌫','0','CLR'],
    ['↵'],
  ];

  function toHex(v) {
    return (v >>> 0).toString(16).toUpperCase().padStart(8, '0');
  }
  function toDec(v) {
    return (v >>> 0).toString(10);
  }

  // ── Build column headers ──────────────────────────────────
  function buildHeaders() {
    const container = document.getElementById('col-headers');
    container.innerHTML = '';

    const spacer = document.createElement('span');
    spacer.style.width = '22px';
    container.appendChild(spacer);

    for (let g = 0; g < 8; g++) {
      const group = document.createElement('div');
      group.className = 'nibble-group';
      for (let b = 0; b < 4; b++) {
        const bitNum = 31 - (g * 4 + b);
        const el = document.createElement('div');
        el.className = 'bit-num';
        el.style.width = '18px';
        el.textContent = bitNum;
        group.appendChild(el);
      }
      container.appendChild(group);
    }

    const spacer2 = document.createElement('span');
    spacer2.style.width = '14px';
    container.appendChild(spacer2);

    const hexLbl = document.createElement('span');
    hexLbl.className = 'col-hex-lbl';
    hexLbl.textContent = 'HEX';
    container.appendChild(hexLbl);

    const decLbl = document.createElement('span');
    decLbl.className = 'col-dec-lbl';
    decLbl.textContent = 'DEC';
    container.appendChild(decLbl);
  }

  // ── Build register rows ───────────────────────────────────
  function buildRows() {
    const container = document.getElementById('rows-container');
    container.innerHTML = '';

    for (let row = 0; row < NUM_ROWS; row++) {
      const rowEl = document.createElement('div');
      rowEl.className = 'row';
      rowEl.id = `row-${row}`;

      // Label
      const lbl = document.createElement('span');
      lbl.className = 'row-label';
      lbl.textContent = `R${row + 1}`;
      rowEl.appendChild(lbl);

      // 8 nibble groups × 4 bits
      for (let g = 0; g < 8; g++) {
        const group = document.createElement('div');
        group.className = 'nibble-group';
        for (let b = 0; b < 4; b++) {
          const bitPos = g * 4 + b;
          const bitEl = document.createElement('div');
          bitEl.className = 'bit';
          bitEl.id = `bit-${row}-${bitPos}`;
          bitEl.dataset.row = row;
          bitEl.dataset.bit = bitPos;
          bitEl.addEventListener('click', () => toggleBit(row, bitPos));
          group.appendChild(bitEl);
        }
        rowEl.appendChild(group);
      }

      // = sign
      const eq = document.createElement('span');
      eq.className = 'eq-sign';
      eq.textContent = '=';
      rowEl.appendChild(eq);

      // HEX button
      const hexBtn = document.createElement('div');
      hexBtn.className = 'val-btn hex-val';
      hexBtn.id = `hex-${row}`;
      hexBtn.addEventListener('click', () => openKb(row, 'hex'));
      rowEl.appendChild(hexBtn);

      // DEC button
      const decBtn = document.createElement('div');
      decBtn.className = 'val-btn dec-val';
      decBtn.id = `dec-${row}`;
      decBtn.addEventListener('click', () => openKb(row, 'dec'));
      rowEl.appendChild(decBtn);

      container.appendChild(rowEl);
    }
  }

  // ── Refresh display for one row ───────────────────────────
  function refreshRow(row) {
    const val = values[row];

    for (let bitPos = 0; bitPos < 32; bitPos++) {
      const bitEl = document.getElementById(`bit-${row}-${bitPos}`);
      const on = (val >>> (31 - bitPos)) & 1;
      bitEl.textContent = on;
      bitEl.classList.toggle('on', !!on);
    }

    const hexEl = document.getElementById(`hex-${row}`);
    hexEl.innerHTML = `<span class="hex-prefix">0x</span>${toHex(val)}`;

    const decEl = document.getElementById(`dec-${row}`);
    decEl.textContent = toDec(val);
  }

  function refreshAll() {
    for (let r = 0; r < NUM_ROWS; r++) refreshRow(r);
  }

  // ── Bit toggle ────────────────────────────────────────────
  function toggleBit(row, bitPos) {
    const mask = 1 << (31 - bitPos);
    values[row] = (values[row] ^ mask) >>> 0;
    refreshRow(row);
  }

  // ── Keyboard ──────────────────────────────────────────────
  function openKb(row, mode) {
    kbRow = row;
    kbMode = mode;
    kbInput = '';

    const overlay = document.getElementById('modal-overlay');
    const dot = document.getElementById('modal-dot');
    const label = document.getElementById('modal-label');
    const display = document.getElementById('modal-display');
    const prefix = document.getElementById('modal-prefix');
    const cursor = document.getElementById('modal-cursor');

    dot.className = `modal-dot ${mode}`;
    label.className = `modal-label ${mode}`;
    label.textContent = mode === 'hex'
      ? `Hexadecimal · R${row + 1}`
      : `Decimal · R${row + 1}`;

    display.className = `modal-display ${mode}`;
    prefix.textContent = mode === 'hex' ? '0x' : '';
    document.getElementById('display-value').className = `display-value ${mode}`;
    cursor.className = `cursor ${mode}`;

    buildKb(mode);
    updateDisplay();
    overlay.classList.add('open');
  }

  function closeKb() {
    document.getElementById('modal-overlay').classList.remove('open');
    kbRow = -1;
  }

  function buildKb(mode) {
    const grid = document.getElementById('kb-grid');
    grid.innerHTML = '';
    const layout = mode === 'hex' ? HEX_LAYOUT : DEC_LAYOUT;

    layout.forEach(rowKeys => {
      const rowEl = document.createElement('div');
      rowEl.className = 'kb-row';
      rowKeys.forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'kb-key';
        btn.textContent = key;
        if (key === '↵') { btn.classList.add('enter'); if (rowKeys.length === 1) btn.classList.add('wide'); }
        else if (key === '⌫') btn.classList.add('del');
        else if (key === 'CLR') btn.classList.add('clr');
        else if (/^[A-F]$/.test(key)) btn.classList.add('hex-letter');
        btn.addEventListener('click', () => pressKey(key));
        rowEl.appendChild(btn);
      });
      grid.appendChild(rowEl);
    });
  }

  function updateDisplay() {
    const dv = document.getElementById('display-value');
    dv.textContent = kbInput || '0';
  }

  function pressKey(key) {
    if (key === 'CLR') {
      kbInput = '';
      updateDisplay();
      return;
    }
    if (key === '⌫') {
      kbInput = kbInput.slice(0, -1);
      updateDisplay();
      return;
    }
    if (key === '↵') {
      const val = kbMode === 'hex'
        ? parseInt(kbInput || '0', 16)
        : parseInt(kbInput || '0', 10);
      if (!isNaN(val) && val >= 0 && val <= MAX_U32) {
        values[kbRow] = val >>> 0;
        refreshRow(kbRow);
      }
      closeKb();
      return;
    }

    const newInput = kbInput + key;
    const val = kbMode === 'hex'
      ? parseInt(newInput, 16)
      : parseInt(newInput, 10);
    if (isNaN(val) || val < 0 || val > MAX_U32) return;
    if (kbMode === 'hex' && newInput.length > 8) return;
    if (kbMode === 'dec' && newInput.length > 10) return;

    kbInput = newInput;
    updateDisplay();
  }

  // Close modal when clicking overlay
  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeKb();
  });

  // ── Init ──────────────────────────────────────────────────
  buildHeaders();
  buildRows();
  refreshAll();
</script>
</body>
</html>
